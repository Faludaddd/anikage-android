name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Cheap structural validation BEFORE spending a build slot.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pre-build validation
        run: python scripts/validate.py

  build:
    name: Build release APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK (signed with the committed keystore)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK exists and signature is stable
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: release APK was not produced"
            exit 1
          fi
          ls -la "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK" | head -n6

      - name: Rename APK with version
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk \
             "Anikage-v${VERSION}-release.apk"
          echo "APK_NAME=Anikage-v${VERSION}-release.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anikage-APK
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

  release:
    name: Publish release (tag builds only)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Anikage-APK

      - name: Create GitHub release with the single APK
        uses: softprops/action-gh-release@v2
        with:
          files: Anikage-v*-release.apk
          generate_release_notes: false
          body: |
            Native Android client for Anikage.

            - One signed release APK (stable keystore — installs over previous versions)
            - In-app Logger: Settings → Diagnostics → Logger
            - Report issues with a log export from the Logger screen
